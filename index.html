<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>健康状态 · 每日记录</title>
  <style>:root {
  color-scheme: light;
  --canvas: #f8f7f3;
  --paper: #fffefa;
  --ink: #23372f;
  --muted: #728077;
  --line: #e4e7df;
  --sage: #dbe8db;
  --green: #2f6653;
  --deep: #557c9c;
  --light: #a2c5d2;
  --rem: #9a8cb6;
  --awake: #d4aa70;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button {
  min-height: 38px;
  padding: 0 15px;
  border: 1px solid #d9e1d8;
  border-radius: 999px;
  color: #4f6659;
  background: transparent;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
}
button:hover:not(:disabled) { border-color: #9ab8a3; background: #eef3ec; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #94bea1; outline-offset: 3px; }
button.primary { border-color: var(--green); color: #fff; background: var(--green); }
button.primary:hover:not(:disabled) { background: #245442; }

.page { width: min(1060px, calc(100% - 48px)); margin: 0 auto; padding: 27px 0 76px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid #dfe5db; }
header > div:first-child { display: grid; grid-template-columns: 38px auto; column-gap: 13px; align-items: center; }
.brand-mark { display: grid; grid-row: 1 / 3; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: var(--green); background: #e7eee5; font-size: 21px; font-weight: 600; line-height: 1; }
.eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .1em; }
header .eyebrow { align-self: end; letter-spacing: .04em; }
h1 { margin: 0; font-size: 27px; line-height: 1.15; font-weight: 780; letter-spacing: -.035em; }
.subtle, .meta { color: var(--muted); font-size: 13px; }
header .subtle { grid-column: 2; margin-top: 7px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 6px; }

.token-panel { display: none; margin-top: 18px; padding: 19px 21px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.token-panel.visible { display: block; }
.token-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 9px; margin-top: 13px; }
input { width: 100%; min-width: 0; min-height: 40px; padding: 0 13px; border: 1px solid #d2dcd1; border-radius: 9px; color: var(--ink); background: #fff; }
.status-line { margin-top: 18px; padding: 11px 14px; border: 1px solid #e7dcc7; border-radius: 10px; color: #76613f; background: #fff9e9; font-size: 13px; }
.status-line:empty { display: none; }

.panel { margin-top: 32px; }
.panel-head, .timeline-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.panel-head { margin-bottom: 15px; }
.panel-head .eyebrow { margin-bottom: 4px; }
h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 780; letter-spacing: -.025em; }
.panel-head .meta { padding-bottom: 2px; }
.summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.summary-item { display: flex; flex-direction: column; min-width: 0; min-height: 142px; padding: 19px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
.summary-label { color: var(--muted); font-size: 13px; font-weight: 700; }
.summary-value { margin-top: 19px; font-size: clamp(21px, 2.6vw, 27px); line-height: 1.18; font-weight: 780; letter-spacing: -.025em; overflow-wrap: anywhere; }
.summary-item::after { display: block; width: 25px; height: 3px; margin-top: auto; border-radius: 3px; background: #9dbca2; content: ""; }
.summary-item:nth-child(3)::after { background: #d6aa7b; }
.summary-item:nth-child(4)::after { background: #ad9bbb; }

.timeline-head { margin: 40px 0 16px; }
.timeline-head .meta { padding-bottom: 3px; }
.day-list { display: grid; gap: 10px; }
.day-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.day-card.latest { border-color: #b9d0bd; }
.day-top { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 106px; padding: 20px 23px; list-style: none; cursor: pointer; }
.day-top::-webkit-details-marker { display: none; }
.day-top:hover { background: #fbfcf8; }
.day-card[open] > .day-top { background: #f2f7f0; }
.day-main { min-width: 0; }
.day-title { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
.day-date { font-size: 19px; line-height: 1.25; font-weight: 780; }
.headline { margin-top: 7px; color: #617268; font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; padding: 2px 10px; border-radius: 999px; color: #5a665d; background: #edf0e9; font-size: 12px; font-weight: 750; white-space: nowrap; }
.badge::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
.badge.good { color: #317455; background: #e0eee1; }
.badge.steady { color: #456b86; background: #e5eff4; }
.badge.active { color: #9a6b3e; background: #f7ead9; }
.badge.warning { color: #a25b50; background: #f8e6df; }
.badge.period { color: #8c5974; background: #f5e7ed; }
.day-side { display: flex; align-items: center; gap: 21px; flex-shrink: 0; }
.day-quick { display: flex; gap: 24px; }
.day-quick span { display: grid; gap: 3px; }
.day-quick small { color: var(--muted); font-size: 11px; font-weight: 700; }
.day-quick b { font-size: 14px; font-weight: 760; white-space: nowrap; }
.day-card[open] .day-quick { display: none; }
.chevron { display: block; width: 9px; height: 9px; border-right: 2px solid #789081; border-bottom: 2px solid #789081; transform: rotate(45deg); transition: transform 160ms ease; }
.day-card[open] .chevron { transform: rotate(225deg); }
.day-body { display: grid; gap: 23px; padding: 22px 23px 25px; border-top: 1px solid #e6ece2; }
.metric-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; overflow: hidden; border: 1px solid #e5e9e2; border-radius: 11px; background: #e5e9e2; }
.metric { min-width: 0; min-height: 112px; padding: 15px 16px; background: #fafbf7; }
.metric-label, .activity-label { color: var(--muted); font-size: 11px; font-weight: 700; }
.metric-value { margin-top: 7px; font-size: 18px; line-height: 1.22; font-weight: 780; overflow-wrap: anywhere; }
.metric-note { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
.food-section, .activity-section { display: grid; gap: 10px; }
.section-title { color: #456353; font-size: 13px; font-weight: 780; }
.food-list { display: flex; flex-wrap: wrap; gap: 7px; }
.food-chip { display: inline-flex; align-items: center; min-height: 32px; padding: 5px 10px; border: 1px solid #dfe9dd; border-radius: 999px; color: #42604c; background: #f6faf4; font-size: 12px; font-weight: 700; }
.sleep-stage { display: grid; gap: 10px; }
.stage-bar { display: flex; height: 9px; overflow: hidden; border-radius: 999px; background: #e4e9e2; }
.stage-segment { min-width: 2px; }
.stage-segment.deep, .stage-dot.deep { background: var(--deep); }
.stage-segment.light, .stage-dot.light { background: var(--light); }
.stage-segment.rem, .stage-dot.rem { background: var(--rem); }
.stage-segment.awake, .stage-dot.awake { background: var(--awake); }
.stage-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12px; }
.stage-dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; background: #9ca7a0; }
.activity-card { padding: 15px 17px; border: 1px solid var(--line); border-radius: 11px; }
.activity-top { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid #e9ece5; }
.activity-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 11px; min-width: 0; }
.activity-title { font-size: 15px; font-weight: 780; overflow-wrap: anywhere; }
.activity-time, .activity-type { color: var(--muted); font-size: 12px; font-weight: 700; }
.activity-type { white-space: nowrap; }
.activity-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 13px 12px; padding-top: 13px; }
.activity-stat { min-width: 0; }
.activity-value { margin-top: 3px; font-size: 13px; line-height: 1.3; font-weight: 750; overflow-wrap: anywhere; }
.empty { padding: 11px 13px; border-radius: 8px; color: var(--muted); background: #f5f7f1; font-size: 13px; }

@media (max-width: 760px) {
  .page { width: min(100% - 28px, 600px); padding: 19px 0 48px; }
  header { align-items: flex-start; }
  .summary-strip { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .summary-item { min-height: 132px; }
  .metric-grid, .activity-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .day-quick { gap: 13px; }
}

@media (max-width: 500px) {
  .page { width: calc(100% - 22px); }
  header { display: block; padding-bottom: 21px; }
  .actions { justify-content: flex-start; margin-top: 17px; padding: 0 0 0 51px; }
  .panel { margin-top: 26px; }
  .summary-strip { gap: 8px; }
  .summary-item { padding: 17px; border-radius: 13px; }
  .summary-value { font-size: 21px; }
  .timeline-head { margin-top: 32px; }
  .day-top { min-height: 98px; padding: 17px; }
  .day-date { font-size: 17px; }
  .headline { font-size: 12px; }
  .day-quick { display: none; }
  .day-side { gap: 0; }
  .day-body { gap: 20px; padding: 17px; }
  .metric { min-height: 112px; padding: 12px; }
  .metric-value { font-size: 16px; }
  .token-row { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .token-row input { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  button, .chevron { transition: none; }
}
</style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <span class="brand-mark" aria-hidden="true">♡</span>
        <div class="eyebrow">每日健康记录</div>
        <h1>健康状态</h1>
        <div class="subtle" id="rangeText">每天早晨更新</div>
      </div>
      <div class="actions">
        <button id="refreshButton" type="button">重新读取</button>
        <button id="tokenToggleButton" type="button" aria-controls="tokenPanel" aria-expanded="false">访问设置</button>
      </div>
    </header>

    <section class="token-panel" id="tokenPanel">
      <div class="subtle">Token 只保存在这个浏览器里，用来读取私有数据仓库。</div>
      <div class="token-row">
        <input id="tokenInput" type="password" autocomplete="off" placeholder="GitHub fine-grained token">
        <button class="primary" id="saveTokenButton" type="button">保存</button>
        <button id="clearTokenButton" type="button">清除</button>
      </div>
    </section>

    <div class="status-line" id="statusLine" role="status" aria-live="polite"></div>

    <section class="panel" id="content" aria-label="每日状态" hidden>
      <div class="panel-head">
        <div>
          <div class="eyebrow">这段时间</div>
          <h2>近况一览</h2>
        </div>
        <div class="meta" id="updatedText"></div>
      </div>
      <div class="summary-strip" id="summaryStrip"></div>
      <div class="timeline-head">
        <h2>每日记录</h2>
        <div class="meta">点开日期查看详情</div>
      </div>
      <div class="day-list" id="dayList"></div>
    </section>
  </main>

  <script>
    const CONFIG = {
      owner: "yihuhou",
      repo: "mom-health-data",
      path: "mom-health-summary.json",
      ref: "main"
    };
    const TOKEN_KEY = "mom-health.github-token.v1";

    const els = {
      tokenPanel: document.getElementById("tokenPanel"),
      tokenInput: document.getElementById("tokenInput"),
      saveTokenButton: document.getElementById("saveTokenButton"),
      clearTokenButton: document.getElementById("clearTokenButton"),
      tokenToggleButton: document.getElementById("tokenToggleButton"),
      refreshButton: document.getElementById("refreshButton"),
      statusLine: document.getElementById("statusLine"),
      content: document.getElementById("content"),
      rangeText: document.getElementById("rangeText"),
      updatedText: document.getElementById("updatedText"),
      summaryStrip: document.getElementById("summaryStrip"),
      dayList: document.getElementById("dayList")
    };

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toneClass(tone) {
      return ["good", "steady", "active", "warning"].includes(tone) ? tone : "";
    }

    function formatDateTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("zh-CN", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }

    function getStoredToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function setBusy(isBusy) {
      els.refreshButton.disabled = isBusy;
      els.saveTokenButton.disabled = isBusy;
    }

    function showTokenPanel(show) {
      els.tokenPanel.classList.toggle("visible", show);
      els.tokenToggleButton.setAttribute("aria-expanded", String(show));
      if (show) {
        els.tokenInput.value = getStoredToken();
        window.setTimeout(function () { els.tokenInput.focus(); }, 0);
      }
    }

    async function fetchHealthData(token) {
      const url = "https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/contents/" + encodeURIComponent(CONFIG.path) + "?ref=" + encodeURIComponent(CONFIG.ref) + "&_=" + Date.now();
      const response = await fetch(url, {
        cache: "no-store",
        headers: {
          "Accept": "application/vnd.github.raw+json",
          "Authorization": "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28"
        }
      });

      if (!response.ok) {
        throw new Error("GitHub 返回 " + response.status);
      }

      const text = await response.text();
      const parsed = JSON.parse(text);
      if (parsed && parsed.encoding === "base64" && parsed.content) {
        const binary = atob(parsed.content.replace(/\s/g, ""));
        const bytes = Uint8Array.from(binary, function (char) { return char.charCodeAt(0); });
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      }
      return parsed;
    }

    function renderSummary(data) {
      const totals = data.totals || {};
      const items = [
        ["平均睡眠", totals.avgSleepText],
        ["日均步数", totals.avgStepsText],
        ["运动时间", totals.exerciseText],
        ["运动记录", (totals.activityCount || 0) + " 条"]
      ];
      els.summaryStrip.innerHTML = items.map(function (item) {
        return '<div class="summary-item">' +
          '<div class="summary-label">' + escapeHtml(item[0]) + '</div>' +
          '<div class="summary-value">' + escapeHtml(item[1] || "暂无") + '</div>' +
          '</div>';
      }).join("");
    }

    function renderStages(stages) {
      if (!stages || !stages.length) {
        return '<div class="empty">暂无睡眠成分。</div>';
      }
      const segments = stages.map(function (stage) {
        return '<span class="stage-segment ' + escapeHtml(stage.key) + '" style="width:' + Math.max(stage.percent, 1) + '%"></span>';
      }).join("");
      const legend = stages.map(function (stage) {
        return '<span><span class="stage-dot ' + escapeHtml(stage.key) + '"></span>' + escapeHtml(stage.label) + ' ' + escapeHtml(stage.percent) + '%</span>';
      }).join("");
      return '<div class="sleep-stage">' +
        '<div class="stage-bar">' + segments + '</div>' +
        '<div class="stage-legend">' + legend + '</div>' +
        '</div>';
    }

    function renderMetric(label, value, note) {
      return '<div class="metric">' +
        '<div class="metric-label">' + escapeHtml(label) + '</div>' +
        '<div class="metric-value">' + escapeHtml(value) + '</div>' +
        '<div class="metric-note">' + escapeHtml(note || "") + '</div>' +
        '</div>';
    }

    function renderActivityStat(label, value) {
      return '<div class="activity-stat">' +
        '<div class="activity-label">' + escapeHtml(label) + '</div>' +
        '<div class="activity-value">' + escapeHtml(value) + '</div>' +
        '</div>';
    }

    const FOOD_CATEGORIES = {
      staple: ["🍚", "主食"],
      red_meat: ["🥩", "红肉"],
      poultry: ["🍗", "禽肉"],
      eggs: ["🥚", "蛋类"],
      seafood: ["🐟", "水产"],
      vegetables: ["🥬", "蔬菜"],
      fruit: ["🍎", "水果"],
      nuts_seeds: ["🌰", "坚果种子"],
      dairy: ["🥛", "乳制品"],
      soy: ["🫘", "豆制品"],
      sweets: ["🍰", "零食甜品"],
      beverages: ["🥤", "饮品"],
      soup_porridge: ["🍲", "汤粥"]
    };

    function renderFood(day) {
      const food = day.food || { status: "not_recorded", categories: [] };
      const categories = Array.isArray(food.categories)
        ? food.categories.filter(function (key) { return FOOD_CATEGORIES[key]; })
        : [];
      if (!categories.length) {
        const text = food.status === "recorded" ? "🍽️ 饮食有记录，类别不详" : "🍽️ 饮食未记录";
        return '<div class="food-section"><div class="section-title">饮食记录</div><div class="empty">' + text + '</div></div>';
      }
      const chips = categories.map(function (key) {
        const category = FOOD_CATEGORIES[key];
        return '<span class="food-chip">' + category[0] + ' ' + escapeHtml(category[1]) + '</span>';
      }).join("");
      return '<div class="food-section"><div class="section-title">饮食记录</div><div class="food-list">' + chips + '</div></div>';
    }

    function renderActivities(day) {
      if (!day.activities || !day.activities.length) {
        return '<div class="activity-section"><div class="section-title">运动记录</div><div class="empty">这一天没有单独运动记录。</div></div>';
      }

      const records = day.activities.map(function (activity) {
        const stats = [
          ["时长", activity.durationText],
          ["距离", activity.distanceText],
          ["负荷", activity.trainingLoadText],
          ["体感", activity.perceivedEffortText],
          ["平均心率", activity.avgHeartRateText],
          ["爬升/下降", activity.elevationText],
          ["消耗", activity.caloriesText],
          ["训练效果", activity.trainingEffectText]
        ].map(function (item) {
          return renderActivityStat(item[0], item[1] || "暂无");
        }).join("");

        return '<article class="activity-card">' +
          '<div class="activity-top">' +
            '<div class="activity-heading">' +
              '<div class="activity-title">' + escapeHtml(activity.title) + '</div>' +
              '<div class="activity-time">' + escapeHtml(activity.timeText || "暂无时段") + '</div>' +
            '</div>' +
            '<div class="activity-type">' + escapeHtml(activity.type) + '</div>' +
          '</div>' +
          '<div class="activity-grid">' + stats + '</div>' +
          '</article>';
      }).join("");

      return '<div class="activity-section"><div class="section-title">运动记录</div>' + records + '</div>';
    }

    function renderDay(day, index) {
      const cls = toneClass(day.status && day.status.tone);
      const latestClass = index === 0 ? " latest" : "";
      const extraBadge = day.menstrualTag
        ? '<span class="badge period">' + escapeHtml(day.menstrualTag.label) + '</span>'
        : "";
      const metrics = [
        renderMetric("睡眠", day.sleep.durationText, (day.sleep.window || "暂无睡眠时间") + " · " + day.sleep.scoreText + " · " + day.sleep.awakeText + " · 午睡 " + (day.sleep.napText || "暂无")),
        renderMetric("HRV", day.vitals.hrvText, day.vitals.hrvNote || "睡眠 HRV"),
        renderMetric("静息心率", day.vitals.restingText, "恢复 " + day.vitals.recoveryText + " · 负荷比 " + day.vitals.loadRatioText),
        renderMetric("日间活动", day.activity.stepsText, day.activity.exerciseText + " · " + day.activity.activeCaloriesText)
      ].join("");

      return '<details class="day-card' + latestClass + '"' + (index === 0 ? ' open' : '') + '>' +
        '<summary class="day-top">' +
          '<div class="day-main">' +
            '<div class="day-title">' +
              '<span class="day-date">' + escapeHtml(day.label) + '</span>' +
              '<span class="badge ' + cls + '">' + escapeHtml(day.status.label) + '</span>' +
              extraBadge +
            '</div>' +
            '<div class="headline">' + escapeHtml(day.status.headline) + '</div>' +
          '</div>' +
          '<div class="day-side">' +
            '<div class="day-quick">' +
              '<span><small>睡眠</small><b>' + escapeHtml(day.sleep.durationText) + '</b></span>' +
              '<span><small>步数</small><b>' + escapeHtml(day.activity.stepsText) + '</b></span>' +
            '</div>' +
            '<span class="chevron" aria-hidden="true"></span>' +
          '</div>' +
        '</summary>' +
        '<div class="day-body">' +
          '<div class="metric-grid">' + metrics + '</div>' +
          renderFood(day) +
          renderStages(day.sleep.stages) +
          renderActivities(day) +
        '</div>' +
        '</details>';
    }

    function render(data) {
      const days = data.days || [];
      if (!Array.isArray(days) || !days.length) {
        els.content.hidden = true;
        els.statusLine.textContent = "读到了旧版数据，请点重新读取或稍后刷新。";
        return;
      }
      els.content.hidden = false;
      els.rangeText.textContent = (data.updateCadence || "每天早晨更新") + " · " + data.dateRange.label;
      els.updatedText.textContent = "生成于 " + formatDateTime(data.generatedAt);
      renderSummary(data);
      els.dayList.innerHTML = days.map(renderDay).join("");
    }

    async function load() {
      const token = getStoredToken();
      if (!token) {
        els.statusLine.textContent = "需要先保存 Token。";
        els.content.hidden = true;
        showTokenPanel(true);
        return;
      }

      try {
        setBusy(true);
        els.statusLine.textContent = "正在读取数据...";
        const data = await fetchHealthData(token);
        render(data);
        els.statusLine.textContent = "";
        showTokenPanel(false);
      } catch (error) {
        els.content.hidden = true;
        els.statusLine.textContent = "读取失败：" + error.message;
        showTokenPanel(true);
      } finally {
        setBusy(false);
      }
    }

    els.tokenToggleButton.addEventListener("click", function () {
      showTokenPanel(!els.tokenPanel.classList.contains("visible"));
    });

    els.refreshButton.addEventListener("click", load);

    els.saveTokenButton.addEventListener("click", function () {
      const token = els.tokenInput.value.trim();
      if (token) {
        localStorage.setItem(TOKEN_KEY, token);
      }
      load();
    });

    els.clearTokenButton.addEventListener("click", function () {
      localStorage.removeItem(TOKEN_KEY);
      els.tokenInput.value = "";
      els.content.hidden = true;
      els.statusLine.textContent = "Token 已清除。";
      showTokenPanel(true);
    });

    load();
  </script>
</body>
</html>
